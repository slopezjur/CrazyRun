<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CrazyRun</title>
  </head>
  <body>
    <div id="debug-overlay" style="position: absolute; top: 55px; left: 10px; color: #00ffcc; font-family: monospace; background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px; pointer-events: none; z-index: 100; font-size: 0.8rem;">
      State: MainMenu<br>UPS: 0
    </div>
    
    <div id="app">
      <canvas id="game-canvas"></canvas>
      
      <!-- UI Overlay -->
      <div id="ui-layer">
        
        <!-- Main Menu -->
        <div id="panel-main-menu" class="ui-panel active">
          <div class="menu-top-bar">
            <button id="btn-audio" class="icon-toggle-btn" aria-label="Toggle Audio">🔊</button>
            <button id="btn-lang" class="lang-toggle-btn" aria-label="Change Language">🌐 English</button>
          </div>
          <h1>CRAZY RUN</h1>
          <p class="subtitle" data-i18n="subtitle">An Endless WebGPU Experience</p>
          <button id="btn-play" class="primary-btn" data-i18n="btnPlay">PLAY NOW</button>
        </div>

        <!-- HUD -->
        <div id="panel-hud" class="ui-panel hidden">
          <div class="score-container">
            <span class="score-label" data-i18n="score">SCORE</span>
            <span id="score-display">0</span>
          </div>

          <!-- Desktop Key Hints -->
          <div id="controls-hud-desktop">
            <div class="control-group">
              <span class="keycap">A</span><span class="keycap">D</span>
              <span class="control-label" data-i18n="lane">Lane</span>
            </div>
            <div class="control-group">
              <span class="keycap">W</span><span class="keycap space">Space</span>
              <span class="control-label" data-i18n="jump">Jump</span>
            </div>
            <div class="control-group">
              <span class="keycap">S</span>
              <span class="control-label" data-i18n="slide">Slide</span>
            </div>
          </div>

          <!-- Mobile Touch Action Buttons -->
          <div id="controls-touch-mobile">
            <div class="touch-cluster left-cluster">
              <button id="btn-touch-left" class="touch-btn" aria-label="Move Left">◀</button>
              <button id="btn-touch-right" class="touch-btn" aria-label="Move Right">▶</button>
            </div>
            <div class="touch-cluster right-cluster">
              <button id="btn-touch-jump" class="touch-btn action-jump" aria-label="Jump">▲</button>
              <button id="btn-touch-slide" class="touch-btn action-slide" aria-label="Slide">▼</button>
            </div>
          </div>
        </div>

        <!-- Pause Menu -->
        <div id="panel-paused" class="ui-panel hidden glass">
          <h2 data-i18n="paused">PAUSED</h2>
          <button id="btn-resume" class="primary-btn" data-i18n="btnResume">RESUME</button>
        </div>

        <!-- Game Over -->
        <div id="panel-game-over" class="ui-panel hidden glass">
          <h2 data-i18n="crashed">CRASHED!</h2>
          <div class="final-score-box">
            <span class="score-label" data-i18n="finalScore">FINAL SCORE</span>
            <span id="final-score-display">0</span>
          </div>
          <div class="high-score-box">
            <span class="score-label" data-i18n="highScore">HIGH SCORE</span>
            <span id="high-score-display">0</span>
          </div>
          <button id="btn-restart" class="primary-btn" data-i18n="btnRestart">TRY AGAIN</button>
        </div>

      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
