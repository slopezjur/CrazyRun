<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrazyRun - WebGPU Environment Setup</title>
  </head>
  <body>
    <div id="debug-overlay" style="position: absolute; top: 60px; left: 10px; color: #00ffcc; font-family: monospace; background: rgba(0,0,0,0.5); padding: 10px; pointer-events: none; z-index: 100;">
      State: MainMenu<br>UPS: 0
    </div>
    
    <div id="app">
      <canvas id="game-canvas"></canvas>
      
      <!-- UI Overlay -->
      <div id="ui-layer">
        
        <!-- Main Menu -->
        <div id="panel-main-menu" class="ui-panel active">
          <h1>CRAZY RUN</h1>
          <p class="subtitle">An Endless WebGPU Experience</p>
          <button id="btn-play" class="primary-btn">PLAY NOW</button>
        </div>

        <!-- HUD -->
        <div id="panel-hud" class="ui-panel hidden">
          <div class="score-container">
            <span class="score-label">SCORE</span>
            <span id="score-display">0</span>
          </div>
        </div>

        <!-- Pause Menu -->
        <div id="panel-paused" class="ui-panel hidden glass">
          <h2>PAUSED</h2>
          <button id="btn-resume" class="primary-btn">RESUME</button>
        </div>

        <!-- Game Over -->
        <div id="panel-game-over" class="ui-panel hidden glass">
          <h2>CRASHED!</h2>
          <div class="final-score-box">
            <span class="score-label">FINAL SCORE</span>
            <span id="final-score-display">0</span>
          </div>
          <div class="high-score-box">
            <span class="score-label">HIGH SCORE</span>
            <span id="high-score-display">0</span>
          </div>
          <button id="btn-restart" class="primary-btn">TRY AGAIN</button>
        </div>

      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
